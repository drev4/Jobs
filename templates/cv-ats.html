<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CV</title>
<style>
  /* Plantilla ATS: una sola columna, sin tablas, sin cabeceras/pies,
     fuentes estándar. Sustituye el bloque marcado por el contenido del CV. */
  @page { size: A4; margin: 14mm 15mm; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10.5pt;
    line-height: 1.38;
    color: #1a1a1a;
    max-width: 190mm;
    margin: 0 auto;
    padding: 10mm;
  }

  /* Nombre */
  h1 {
    font-size: 19pt;
    letter-spacing: .2px;
    margin: 0 0 2px;
  }
  /* Titular profesional: párrafo inmediatamente posterior al h1 */
  h1 + p {
    font-size: 11pt;
    color: #333;
    margin: 0 0 4px;
    font-weight: bold;
  }
  /* Línea de contacto: segundo párrafo tras el h1 */
  h1 + p + p {
    font-size: 9.5pt;
    color: #444;
    margin: 0 0 12px;
  }

  /* Secciones */
  h2 {
    font-size: 11pt;
    text-transform: uppercase;
    letter-spacing: .6px;
    border-bottom: 1px solid #999;
    padding-bottom: 2px;
    margin: 15px 0 7px;
  }
  /* Puesto · Empresa */
  h3 {
    font-size: 10.5pt;
    margin: 9px 0 1px;
  }
  /* Metadatos del puesto (fechas, ciudad, modalidad) */
  h3 + p {
    font-size: 9.5pt;
    color: #555;
    margin: 0 0 4px;
  }

  p { margin: 0 0 6px; }

  ul { margin: 3px 0 6px; padding-left: 17px; }
  li { margin-bottom: 2.5px; }

  a { color: #1a1a1a; text-decoration: none; }

  strong { font-weight: bold; }

  hr { border: 0; border-top: 1px solid #ccc; margin: 10px 0; }

  /* Evita cortes feos al paginar */
  h2, h3 { break-after: avoid; page-break-after: avoid; }
  li, h3 + p { break-inside: avoid; page-break-inside: avoid; }

  @media print {
    body { padding: 0; max-width: none; }
  }
</style>
</head>
<body>

<!--CONTENT-->

</body>
</html>
